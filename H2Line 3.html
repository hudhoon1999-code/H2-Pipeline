<script>
'use strict';

// ── UTILS ──────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

  set: (k, v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} }
};
const money = n => 'Rf' + Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt2 = n => Number(n||0).toFixed(2);
const GST_RATE = 8;

// Week helpers (Sat=start Thu=end)
function weekStart(ds) {
  const d = new Date(ds), day = d.getDay();
  const diff = day===6 ? 0 : -(day+1);
  const s = new Date(d); s.setDate(d.getDate()+diff);
  return s.toISOString().split('T')[0];
}
function weekLabel(ds) {
  const d = new Date(ds), day = d.getDay();
  const diff = day===6 ? 0 : -(day+1);
  const s = new Date(d); s.setDate(d.getDate()+diff);
  const e = new Date(s); e.setDate(s.getDate()+5);
  const f = x => x.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
  return f(s) + ' \u2013 ' + f(e);
}

// GST helpers
function calcGST(lineTotal, inclusive) {
  const t = parseFloat(lineTotal)||0;
  if (inclusive) {
    const base = t/1.08;
    return { base:+base.toFixed(2), gst:+(t-base).toFixed(2), total:t };
  }
  const gst = t*0.08;
  return { base:t, gst:+gst.toFixed(2), total:+(t+gst).toFixed(2) };
}

// Price tier helpers
function calcTiers(unitPrice) {
  const u = parseFloat(unitPrice)||0;
  return { unit:u, halfDozen:+(u*6*0.97).toFixed(2), casePrice:+(u*12*0.94).toFixed(2) };
}
function tierLabel(t) {
  if (t==='casePrice') return 'Case (12)';
  if (t==='halfDozen') return 'Half Dozen (6)';
  return 'Unit';
}

// Toast
function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('app');
  if (!root) return;
  document.body.className = STATE.dark ? 'dark' : 'light';
  if (!STATE.user) { root.innerHTML = renderAuth(); bindAuth(); return; }
  const viewerFab = STATE.isViewer ? '' : renderFab();
  root.innerHTML = renderTopBar() + '<div id="content" class="fu">' + renderPage() + '</div>' + viewerFab + renderNav() + (STATE.modal ? renderModal() : '');
  bindPage();
  if (STATE.modal) bindModal();
}

// ── AUTH ────────────────────────────────────────────────────────────────────
let authMode = 'login';
function renderAuth() {
  return '<div class="authbg"><div style="width:100%;max-width:400px" class="fu">' +
    '<div style="font-family:Outfit,sans-serif;font-size:30px;font-weight:800;color:var(--a);margin-bottom:6px">H2 Line</div>' +
    '<div style="font-size:14px;color:var(--t2);margin-bottom:28px">Distribution sales, simplified.</div>' +
    '<div class="card"><div style="display:flex;gap:6px;margin-bottom:20px">' +
    '<button id="tab-login" onclick="switchTab(\'login\')" style="flex:1;padding:10px;border-radius:var(--rs);border:none;cursor:pointer;font-weight:700;font-size:14px;background:var(--a);color:#fff">Log In</button>' +
    '<button id="tab-signup" onclick="switchTab(\'signup\')" style="flex:1;padding:10px;border-radius:var(--rs);border:none;cursor:pointer;font-weight:700;font-size:14px;background:var(--s2);color:var(--t2)">Sign Up</button>' +
    '</div><div class="fg">' +
    '<div class="iw" id="name-row" style="display:none"><label class="il">Full Name</label><input id="a-name" class="inp" placeholder="Your name"></div>' +
    '<div class="iw"><label class="il">Email</label><input id="a-email" class="inp" type="email" placeholder="you@example.com" autocomplete="email"></div>' +
    '<div class="iw" style="position:relative"><label class="il">Password</label><input id="a-pw" class="inp" type="password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" style="padding-right:44px" autocomplete="current-password">' +
    '<button onclick="togglePw()" style="position:absolute;right:8px;top:26px;background:none;border:none;cursor:pointer;color:var(--t2);padding:6px">\uD83D\uDC41</button></div>' +
    '<div id="a-msg" style="display:none;padding:10px 13px;border-radius:var(--rx);font-size:13px"></div>' +
    '<button id="a-submit" onclick="doAuth()" class="btn bp bw" style="height:48px">Log In</button>' +
    '<button onclick="switchTab(\'forgot\')" class="btn bg2 bw" style="font-size:13px">Forgot password?</button>' +
    '</div></div>' +
    '<div style="text-align:center;margin-top:14px;font-size:11px;color:var(--t3)">\uD83D\uDD12 Secure per-account storage \u00b7 Add to Home Screen for app experience</div>' +
    '</div></div>';
}
function switchTab(m) {
  authMode = m;
  const nr = document.getElementById('name-row');
  const sub = document.getElementById('a-submit');
  const tl = document.getElementById('tab-login');
  const ts = document.getElementById('tab-signup');
  if (nr) nr.style.display = m === 'signup' ? 'flex' : 'none';
  if (sub) sub.textContent = m === 'login' ? 'Log In' : m === 'signup' ? 'Create Account' : 'Send Reset Link';
  if (tl) { tl.style.background = m === 'login' ? 'var(--a)' : 'var(--s2)'; tl.style.color = m === 'login' ? '#fff' : 'var(--t2)'; }
  if (ts) { ts.style.background = m === 'signup' ? 'var(--a)' : 'var(--s2)'; ts.style.color = m === 'signup' ? '#fff' : 'var(--t2)'; }
}
function togglePw() { const i = document.getElementById('a-pw'); if (i) i.type = i.type === 'password' ? 'text' : 'password'; }
function showAuthMsg(msg, ok=false) {
  const el = document.getElementById('a-msg');
  if (!el) return;
  el.style.display = 'block';
  el.style.background = ok ? 'var(--oks)' : 'var(--errs)';
  el.style.color = ok ? 'var(--ok)' : 'var(--err)';
  el.textContent = msg;
}
function doAuth() {
  const email = (document.getElementById('a-email')||{}).value||'';
  const pw = (document.getElementById('a-pw')||{}).value||'';
  const name = (document.getElementById('a-name')||{}).value||'';
  const sub = document.getElementById('a-submit');
  if (sub) { sub.innerHTML = '<span class="spin"></span>'; sub.disabled = true; }
  setTimeout(() => {
    if (sub) sub.disabled = false;
    if (authMode === 'forgot') { showAuthMsg('\u2713 Reset link sent to ' + email, true); return; }
    if (authMode === 'signup') {
      if (!name||!email||!pw) { showAuthMsg('Please fill all fields.'); if(sub) sub.textContent='Create Account'; return; }
      const users = db.get('users', []);
      if (users.find(u => u.email === email)) { showAuthMsg('Email already registered.'); if(sub) sub.textContent='Create Account'; return; }
      const nu = {id:uid(), name, email, password:pw};
      db.set('users', [...users, nu]); db.set('user', nu);
      STATE.user = nu; seedData(); render(); return;
    }
    const users = db.get('users', []);
    const u = users.find(x => x.email===email && x.password===pw);
    if (u) { db.set('user', u); STATE.user = u; seedData(); render(); }
    else {
      const nu = {id:uid(), name:email.split('@')[0]||'User', email, password:pw};
      db.set('users', [...users, nu]); db.set('user', nu);
      STATE.user = nu; seedData(); render();
    }
  }, 700);
}
function bindAuth() { document.getElementById('a-pw')?.addEventListener('keydown', e => { if(e.key==='Enter') doAuth(); }); }

// ── NAV ──────────────────────────────────────────────────────────────────────
function renderNav() {
  const tabs = [
    {id:'dashboard',ico:IC.home,lbl:'Home'},
    {id:'sales',ico:IC.sales,lbl:'Sales'},
    {id:'invoices',ico:IC.inv,lbl:'Invoices'},
    {id:'report',ico:IC.report,lbl:'Reports'},
    {id:'shops',ico:IC.shop,lbl:'Shops'},
    {id:'items',ico:IC.items,lbl:'Items'},
    {id:'importexport',ico:IC.ul,lbl:'Data'},
  ];
  return '<nav id="bottomnav">' + tabs.map(t =>
    '<button class="nb' + (STATE.page===t.id?' on':'') + '" onclick="goPage(\'' + t.id + '\')">' +
    t.ico + '<span>' + t.lbl + '</span><div class="ndot"></div></button>'

function renderFab() {
  if (['settings','importexport'].includes(STATE.page)) return '';
  return '<button id="fab" onclick="openAddSale()">' + IC.plus + '</button>';
}
function goPage(p) { STATE.page = p; STATE.modal = null; render(); }

// ── PAGE ROUTER ──────────────────────────────────────────────────────────────
function renderPage() {
  switch(STATE.page) {
    case 'dashboard': return renderDashboard();
    case 'sales': return renderSalesPage();
    case 'invoices': return renderInvoices();
    case 'report': return renderReport();
    case 'shops': return renderShops();
    case 'items': return renderItems();
    case 'importexport': return renderImportExport();
    case 'settings': return renderSettings();
    default: return renderDashboard();
  }
}
function bindPage() {
  if (STATE.page==='sales') bindSales();
  else if (STATE.page==='shops') bindShops();
  else if (STATE.page==='items') bindItems();
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function renderDashboard() {
  const S = STATE.sales;
  const total = S.reduce((a,r) => a+r.finalTotal, 0);
  const paid = S.filter(r => r.paymentStatus==='Paid').reduce((a,r) => a+r.finalTotal, 0);
  const pend = S.filter(r => r.paymentStatus==='Pending').reduce((a,r) => a+r.finalTotal, 0);
  const gstTot = S.reduce((a,r) => a+(r.gstAmt||0), 0);
  const shopMap = {};
  S.forEach(r => { shopMap[r.shopName] = (shopMap[r.shopName]||0) + r.finalTotal; });
  const topShops = Object.entries(shopMap).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const itemMap = {};
  S.forEach(r => { itemMap[r.itemName] = (itemMap[r.itemName]||0) + r.finalTotal; });
  const topItems = Object.entries(itemMap).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const wmap = {};
  S.forEach(r => { const w=weekStart(r.date); wmap[w]=(wmap[w]||0)+r.finalTotal; });
  const wks = Object.keys(wmap).sort().slice(-7);
  const wdata = wks.length>=2 ? wks.map(w=>wmap[w]) : [1200,1800,1500,2400,1900,2600,total||2000];
  const mx = Math.max(...wdata, 1);
  const recent = [...S].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);

  return '<div class="fu">' +
    '<div style="margin-bottom:18px">' +
      '<div style="font-size:12px;color:var(--t2)">' + new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'}) + '</div>' +
      '<h1 style="font-size:24px;font-weight:800;margin-top:2px">Good day \uD83D\uDC4B</h1>' +
    '</div>' +
    '<div class="kgrid stag" style="margin-bottom:16px">' +
      '<div class="kcard fu"><div class="klbl">Total Sales</div><div class="kval" style="color:var(--a)">' + money(total) + '</div><div class="ksub">' + S.length + ' transactions</div></div>' +
      '<div class="kcard fu"><div class="klbl">Collected</div><div class="kval" style="color:var(--ok)">' + money(paid) + '</div><div class="ksub">' + (total>0?Math.round(paid/total*100):0) + '% of total</div></div>' +
      '<div class="kcard fu"><div class="klbl">Pending</div><div class="kval" style="color:var(--warn)">' + money(pend) + '</div><div class="ksub">' + S.filter(r=>r.paymentStatus==='Pending').length + ' orders</div></div>' +
      '<div class="kcard fu"><div class="klbl">GST Collected</div><div class="kval" style="color:var(--gst)">' + money(gstTot) + '</div><div class="ksub">@ 8% rate</div></div>' +
    '</div>' +
    '<div class="card" style="margin-bottom:14px">' +
      '<div class="sh"><div class="st">Weekly Trend</div><button class="btn bg2" style="font-size:11px;padding:5px 9px" onclick="goPage(\'report\')">View \u2192</button></div>' +
      '<div class="cbw">' + wdata.map((v,i) => '<div class="cb" style="height:' + Math.round(v/mx*100) + '%;background:' + (i===wdata.length-1?'var(--a)':'var(--as)') + '"></div>').join('') + '</div>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">' +
      '<div class="card csm"><div class="st" style="font-size:13px;margin-bottom:10px">Top Shops</div>' +
        (topShops.length ? topShops.map(([n,t],i) => '<div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:11px"><span><span style="color:var(--a);margin-right:4px">' + (i+1) + '.</span>' + n + '</span><span style="color:var(--t2)">' + money(t) + '</span></div>').join('') : '<div style="font-size:11px;color:var(--t3)">No data yet</div>') +
      '</div>' +
      '<div class="card csm"><div class="st" style="font-size:13px;margin-bottom:10px">Top Items</div>' +
        (topItems.length ? topItems.map(([n,t],i) => '<div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:11px"><span><span style="color:var(--a);margin-right:4px">' + (i+1) + '.</span>' + n + '</span><span style="color:var(--t2)">' + money(t) + '</span></div>').join('') : '<div style="font-size:11px;color:var(--t3)">No data yet</div>') +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="sh"><div class="st">Recent Activity</div><button class="btn bg2" style="font-size:11px;padding:5px 9px" onclick="goPage(\'sales\')">All \u2192</button></div>' +
      (recent.length ? recent.map(r =>
        '<div class="li"><div class="lav">' + IC.sales + '</div>' +
        '<div style="flex:1;min-width:0"><div class="ltit" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + r.itemName + '</div>' +
        '<div class="lsub">' + r.shopName + ' \u00b7 ' + r.date + (r.gstInclusive?' \u00b7 <span class="badge bgst" style="font-size:9px">GST Incl.</span>':'') + '</div></div>' +
        '<div class="lrt"><div style="font-size:13px;font-weight:700">' + money(r.finalTotal) + '</div>' +
        '<span class="badge ' + (r.paymentStatus==='Paid'?'bpaid':r.paymentStatus==='Partial'?'bpart':'bpend') + '">' + r.paymentStatus + '</span></div></div>'
      ).join('') : '<div class="empty"><div class="eico">\uD83D\uDCE6</div><div class="esub">No sales yet. Tap + to add!</div></div>') +
    '</div></div>';
}

// Autocomplete
function acShow(inputId, dropId, list) {
  const val = (document.getElementById(inputId)||{}).value||'';
  const drop = document.getElementById(dropId);
  if (!drop) return;
  const filtered = list.filter(s => s && s.toLowerCase().includes(val.toLowerCase()) && s.toLowerCase() !== val.toLowerCase());
  if (!filtered.length) { drop.style.display='none'; return; }
  drop.style.display = 'block';
  drop.innerHTML = filtered.slice(0,8).map(s => '<div class="aci" onmousedown="acPick(\'' + inputId + '\',\'' + dropId + '\',decodeURIComponent(\'' + encodeURIComponent(s) + '\'))">' + s + '</div>').join('');
}
function acHide(id) { const el=document.getElementById(id); if(el) el.style.display='none'; }
function acPick(inputId, dropId, val) {
  const el = document.getElementById(inputId);
  if (el) el.value = val;
  acHide(dropId);
  if (inputId==='sd-item') onItemPick();
  if (inputId==='sd-shop') {
    const sh = STATE.shops.find(s=>s.name===val);
    if (sh) { const a=document.getElementById('sd-area'); if(a&&!a.value) a.value=sh.area||''; }
  }
}
function onItemPick() {
  const name = (document.getElementById('sd-item')||{}).value||'';
  const item = STATE.items.find(i=>i.name.toLowerCase()===name.toLowerCase());
  const ptype = (document.getElementById('sd-ptype')||{}).value||'unit';
  if (item) {
    const cat = document.getElementById('sd-cat'); if(cat&&!cat.value) cat.value=item.category||'';
    const tiers = calcTiers(item.unitPrice);
    const up = document.getElementById('sd-uprice'); if(up) up.value=fmt2(tiers[ptype]||item.unitPrice);
    const tb = document.getElementById('tier-box');
    if (tb) {
      tb.style.display='block';
      const tu=document.getElementById('t-unit'), th=document.getElementById('t-half'), tc=document.getElementById('t-case');
      if(tu) tu.textContent=money(tiers.unit)+' each';
      if(th) th.textContent=money(tiers.halfDozen)+' for 6';
      if(tc) tc.textContent=money(tiers.casePrice)+' for 12';
    }
  } else {
    const tb=document.getElementById('tier-box'); if(tb) tb.style.display='none';
  }
  recalc();
}
function onPtypeChange() {
  const name = (document.getElementById('sd-item')||{}).value||'';
  const item = STATE.items.find(i=>i.name.toLowerCase()===name.toLowerCase());
  if (item) {
    const ptype = (document.getElementById('sd-ptype')||{}).value||'unit';
    const up = document.getElementById('sd-uprice');
    if (up) up.value = fmt2(calcTiers(item.unitPrice)[ptype]||item.unitPrice);
  }
  recalc();
}
function recalc() {
  const up = parseFloat((document.getElementById('sd-uprice')||{}).value)||0;
  const qty = parseFloat((document.getElementById('sd-qty')||{}).value)||0;
  const inc = (document.getElementById('sd-gstinc')||{}).checked||false;
  const lt = +(up*qty).toFixed(2);
  const g = calcGST(lt, inc);
  const dl=document.getElementById('d-line'), dg=document.getElementById('d-gst'), df=document.getElementById('d-final'), dn=document.getElementById('gst-note');
  if(dl) dl.textContent=money(lt);
  if(dg) dg.textContent=money(g.gst);
  if(df) df.textContent=money(g.total);
  if(dn) { dn.style.display=lt>0?'block':'none'; dn.textContent=inc?'GST included: base '+money(g.base)+' + GST '+money(g.gst)+' = '+money(g.total):(lt>0?'+ 8% GST = '+money(g.total)+' total':''); }
}
function saveSale() {
  const v = id => (document.getElementById(id)||{}).value||'';
  const date=v('sd-date'), shopName=v('sd-shop'), area=v('sd-area'), invoiceId=v('sd-inv');
  const itemName=v('sd-item'), category=v('sd-cat'), ptype=v('sd-ptype')||'unit';
  const up=parseFloat(v('sd-uprice'))||0, qty=parseFloat(v('sd-qty'))||0;
  const gstInclusive=(document.getElementById('sd-gstinc')||{}).checked||false;
  const paymentStatus=v('sd-status')||'Pending', notes=v('sd-notes');
  if(!shopName||!itemName||!qty||!up) { showToast('\u26A0\uFE0F Fill: Shop, Item, Qty, Price'); return; }
  const lt=+(up*qty).toFixed(2);
  const g=calcGST(lt, gstInclusive);
  const sale={id:uid(),date,shopName,area,invoiceId,itemName,category,priceType:ptype,quantity:qty,unitPrice:up,lineTotal:lt,gstInclusive,gstRate:GST_RATE,gstAmt:g.gst,finalTotal:g.total,paymentStatus,notes};
  STATE.sales.push(sale);
  if(!STATE.items.find(i=>i.name.toLowerCase()===itemName.toLowerCase()))
    STATE.items.push({id:uid(),name:itemName,category,unitPrice:ptype==='unit'?up:ptype==='halfDozen'?+(up/6).toFixed(2):+(up/12).toFixed(2)});
  if(!STATE.shops.find(s=>s.name.toLowerCase()===shopName.toLowerCase()))
    STATE.shops.push({id:uid(),name:shopName,area,owner:'',contact:'',priority:'Medium',notes:'',lastVisit:date});
  saveState(); showToast('\u2713 Sale saved!'); closeModal();
}

function bindSales() { filterSales(); }
function filterSales() {
  const srch=((document.getElementById('s-srch')||{}).value||'').toLowerCase();

  const sort=(document.getElementById('s-sort')||{}).value||'date';

  if(srch) rows=rows.filter(r=>r.shopName.toLowerCase().includes(srch)||r.itemName.toLowerCase().includes(srch));
  rows.sort((a,b)=>sort==='date'?new Date(b.date)-new Date(a.date):b.finalTotal-a.finalTotal);

  if(!tbl) return;

    rows.map(r => '<tr>' +

      '<td class="nr" style="font-weight:700;font-size:13px">' + money(r.finalTotal) + '</td>' +
      '<td><span class="badge bgst" style="font-size:9px">' + (r.gstInclusive?'Incl.':'+ 8%') + '</span></td>' +
      '<td><span class="badge ' + (r.paymentStatus==='Paid'?'bpaid':r.paymentStatus==='Partial'?'bpart':'bpend') + '">' + r.paymentStatus + '</span></td>' +

function markPaid(id) { STATE.sales=STATE.sales.map(s=>s.id===id?{...s,paymentStatus:'Paid'}:s); saveState(); showToast('\u2713 Marked Paid'); render(); }
function delSale(id) { if(confirm('Delete this sale?')) { STATE.sales=STATE.sales.filter(s=>s.id!==id); saveState(); showToast('Deleted'); render(); } }

// ── INVOICES ──────────────────────────────────────────────────────────────────
let invDetail = null;
function renderInvoices() {
  const imap = {};
  STATE.sales.forEach(s => {
    const key = s.invoiceId || (s.shopName + '-' + s.date);
    if (!imap[key]) imap[key] = {id:key,shopName:s.shopName,area:s.area||'',date:s.date,items:[],lineTotal:0,gstTotal:0,finalTotal:0,paid:0};
    imap[key].items.push(s);
    imap[key].lineTotal += s.lineTotal||0;
    imap[key].gstTotal += s.gstAmt||0;
    imap[key].finalTotal += s.finalTotal||0;
    if(s.paymentStatus==='Paid') imap[key].paid += s.finalTotal||0;
  });
  const invs = Object.values(imap).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if (invDetail) {
    const inv = invs.find(i=>i.id===invDetail);
    if (inv) return renderInvDetail(inv);
    invDetail = null;
  }
  return '<div class="fu"><div style="margin-bottom:14px"><h1 style="font-size:22px;font-weight:800">Invoices</h1><div style="font-size:12px;color:var(--t2)">' + invs.length + ' invoices</div></div>' +
    (invs.length ? invs.map(inv => {
      const stat = inv.paid>=inv.finalTotal&&inv.finalTotal>0?'Paid':inv.paid>0?'Partial':'Pending';
      return '<div class="card csm chov" style="margin-bottom:10px;cursor:pointer" onclick="invDetail=\'' + inv.id + '\';render()">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
        '<div><div style="font-size:10px;color:var(--t3);font-weight:700;letter-spacing:.06em">' + inv.id + '</div>' +
        '<div style="font-size:16px;font-weight:700;margin-top:2px">' + inv.shopName + '</div>' +
        '<div style="font-size:11px;color:var(--t2)">' + inv.area + ' \u00b7 ' + inv.date + ' \u00b7 ' + inv.items.length + ' items</div></div>' +
        '<div style="text-align:right"><div style="font-size:18px;font-weight:800;color:var(--a)">' + money(inv.finalTotal) + '</div>' +
        '<span class="badge ' + (stat==='Paid'?'bpaid':stat==='Partial'?'bpart':'bpend') + '">' + stat + '</span></div></div>' +
        (stat!=='Paid'&&inv.finalTotal>0?'<div class="pb" style="margin-top:10px"><div class="pf" style="width:' + Math.round(inv.paid/inv.finalTotal*100) + '%;background:' + (stat==='Partial'?'var(--warn)':'var(--a)') + '"></div></div>':'') +

  const weeks = Object.keys(wmap).sort().reverse();
  if (weeks.length && !selWeek) selWeek = weeks[0];
  const wd = (selWeek && wmap[selWeek]) ? wmap[selWeek] : [];
  const wTot=wd.reduce((a,r)=>a+r.finalTotal,0);
  const wPaid=wd.filter(r=>r.paymentStatus==='Paid').reduce((a,r)=>a+r.finalTotal,0);

      '<td class="nr" style="font-weight:700;font-size:13px">' + money(s.finalTotal) + '</td>' +
      '<td><span class="badge ' + (s.paymentStatus==='Paid'?'bpaid':s.paymentStatus==='Partial'?'bpart':'bpend') + '">' + s.paymentStatus + '</span></td></tr>'
    ).join('') + '</tbody></table></div>' +
    '<div style="background:var(--s);border:1px solid var(--b);border-radius:0 0 var(--rm) var(--rm);border-top:none;padding:12px 14px;display:flex;flex-direction:column;gap:6px">' +
    '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2)"><span>Subtotal (ex-GST)</span><span>' + money(wd.reduce((a,r)=>a+(r.gstInclusive?r.finalTotal/1.08:(r.lineTotal||0)),0)) + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--gst)"><span>GST @ 8%</span><span>' + money(wGST) + '</span></div>' +
    '<div style="height:1px;background:var(--b)"></div>' +

    : '<div class="empty"><div class="eico">\uD83D\uDCCA</div><div class="etit">No data this week</div></div>') + '</div>';
}

    '<div class="card"><div class="aline"></div><div class="st" style="margin-bottom:6px">Restore from Backup</div>' +
    '<label style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--s2);border:2px dashed var(--b);border-radius:var(--rs);cursor:pointer">' +
    IC.ul + '<div><div style="font-weight:600;font-size:14px">Select backup JSON file</div></div>' +
    '<input type="file" accept=".json" style="display:none" onchange="restoreBackup(this)"></label></div></div>';
}
function exportCSV(key) {
  const data = STATE[key]; if(!data||!data.length){showToast('No data');return;}
  const ks=Object.keys(data[0]);
  const csv=[ks.join(','),...data.map(r=>ks.map(k=>'"'+(String(r[k]||'').replace(/"/g,'""'))+'"').join(','))].join('\n');
  dlFile(csv,'h2line-'+key+'-'+new Date().toISOString().split('T')[0]+'.csv','text/csv');
  showToast('\u2713 Downloaded');
}
function exportBackup() {
  dlFile(JSON.stringify({sales:STATE.sales,items:STATE.items,shops:STATE.shops,exportedAt:new Date().toISOString(),version:'3.0'},null,2),'h2line-backup-'+new Date().toISOString().split('T')[0]+'.json','application/json');
  showToast('\u2713 Backup downloaded');
}
function dlFile(content, name, type) {
  const b=new Blob([content],{type}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function previewCSV(input) {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const lines=ev.target.result.split('\n').filter(Boolean);
    const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
    const rows=lines.slice(1,6).map(line=>{
      const vals=line.split(',').map(v=>v.trim().replace(/"/g,''));
      return headers.reduce((o,h,i)=>{o[h]=vals[i]||'';return o;},{});
    });
    const prev=document.getElementById('csv-preview'); if(!prev) return;
    prev.innerHTML='<div style="margin-top:12px;font-size:12px;font-weight:600;margin-bottom:8px;color:var(--t2)">Preview (first 5 rows):</div>' +
      '<div class="tw"><table class="dt"><thead><tr>' + headers.map(h=>'<th>'+h+'</th>').join('') + '</tr></thead><tbody>' +
      rows.map(r=>'<tr>'+headers.map(h=>'<td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+r[h]+'</td>').join('')+'</tr>').join('') +
      '</tbody></table></div><button class="btn bsuc bw" style="margin-top:10px;height:44px" onclick="showToast(\'CSV preview shown above. Full import coming soon!\')">Import ' + (lines.length-1) + ' Rows</button>';
  };
  reader.readAsText(file);
}
function restoreBackup(input) {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try {
      const bk=JSON.parse(ev.target.result);
      if(!confirm('Restore backup from '+bk.exportedAt+'? This will overwrite current data.')) return;
      if(bk.sales) STATE.sales=bk.sales; if(bk.items) STATE.items=bk.items; if(bk.shops) STATE.shops=bk.shops;
      saveState(); showToast('\u2713 Backup restored!'); render();
    } catch { showToast('\u26A0\uFE0F Invalid backup file'); }
  };
  reader.readAsText(file);
}

    '<div style="font-size:13px;color:var(--t2);margin-bottom:20px">Generate a live view-only link. Viewers can see your data but cannot edit anything.</div>' +
    '<div style="background:' + (SHARE.enabled?'var(--as)':'var(--s2)') + ';border:1.5px solid ' + (SHARE.enabled?'var(--a)':'var(--b)') + ';border-radius:var(--rm);padding:14px;margin-bottom:16px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between"><div><div style="font-weight:700;font-size:15px">Live Sharing</div><div style="font-size:12px;color:var(--t2)">Anyone with the link can view</div></div>' +
    '<label class="share-tog" style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" ' + (SHARE.enabled?'checked':'') + ' onchange="toggleShare(this.checked)"></label></div>' +
    (SHARE.enabled&&link?'<div style="margin-top:12px"><div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px">Your Share Link</div>' +
    '<div class="slink" onclick="copyLink(\'' + link + '\')">' + link + '</div>' +
    '<div style="display:flex;gap:8px;margin-top:8px">' +
    '<button class="btn bp" style="flex:1;padding:9px;font-size:13px" onclick="copyLink(\'' + link + '\')">\uD83D\uDCCB Copy</button>' +
    '<button class="btn bs" style="flex:1;padding:9px;font-size:13px" onclick="shareLink(\'' + link + '\')">\uD83D\uDCE4 Share</button>' +
    '<button class="btn bs" style="padding:9px 12px;font-size:13px" onclick="syncNow()">\uD83D\uDD04 Sync</button></div>' +
    (SHARE.lastPushed?'<div style="font-size:10px;color:var(--t3);margin-top:6px;text-align:center">Last synced: '+new Date(SHARE.lastPushed).toLocaleString('en-IN')+'</div>':'') +
    '</div>':'') + '</div>' +
    '<div style="font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">What viewers can see</div>' +
    '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">' +
    permItems.map(item => '<div style="display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:var(--rs);padding:11px 13px">' +
      '<div style="font-size:18px;width:28px;text-align:center">' + item.ico + '</div>' +
      '<div style="flex:1"><div style="font-size:13px;font-weight:600">' + item.label + '</div><div style="font-size:11px;color:var(--t2)">' + item.desc + '</div></div>' +
      '<label class="share-tog" style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" ' + (p[item.key]?'checked':'') + ' onchange="updatePerm(\'' + item.key + '\',this.checked)"></label></div>'
    ).join('') + '</div>' +
    '<div style="font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">One-time Snapshot</div>' +

    '<div style="display:flex;flex-direction:column;gap:8px">' +
    '<button class="btn bs bw" style="height:42px;font-size:13px" onclick="exportSnap(\'full\')">\uD83D\uDCC4 Full Snapshot</button>' +

    '<button class="btn bs bw" style="height:42px;font-size:13px" onclick="exportSnap(\'report\')">\uD83D\uDCC5 Weekly Report</button>' +

}
async function toggleShare(enabled) {
  SHARE.enabled = enabled;
  if(enabled&&!SHARE.shareId) SHARE.shareId=uid();
  if(!enabled&&SHARE.shareId) {
    if(confirm('Disable sharing? The current link will stop working.')) { await deleteShare(SHARE.shareId); SHARE.shareId=null; SHARE.lastPushed=null; }
    else { SHARE.enabled=true; }
  }
  db.set('shareState',SHARE);
  if(SHARE.enabled) {
    const ok=await pushShare(SHARE.shareId,SHARE.perms);
    if(ok){SHARE.lastPushed=new Date().toISOString();db.set('shareState',SHARE);showToast('\u2713 Live link active!');}
    else showToast('\u26A0\uFE0F Setup Firebase to enable live links');
  }
  STATE.modal={type:'share'}; render();
}
function updatePerm(key,val) {
  SHARE.perms[key]=val; db.set('shareState',SHARE);
  if(SHARE.enabled&&SHARE.shareId) pushShare(SHARE.shareId,SHARE.perms).then(ok=>{if(ok){SHARE.lastPushed=new Date().toISOString();db.set('shareState',SHARE);showToast('\u2713 Updated');}});
}
async function syncNow() {
  showToast('Syncing\u2026');
  const ok=await pushShare(SHARE.shareId,SHARE.perms);
  if(ok){SHARE.lastPushed=new Date().toISOString();db.set('shareState',SHARE);showToast('\u2713 Synced!');STATE.modal={type:'share'};render();}
  else showToast('\u26A0\uFE0F Sync failed');
}
function copyLink(link) {
  if(navigator.clipboard) navigator.clipboard.writeText(link).then(()=>showToast('\u2713 Link copied!'));
  else { const t=document.createElement('textarea');t.value=link;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();showToast('\u2713 Copied!'); }
}
function shareLink(link) {
  if(navigator.share) navigator.share({title:'H2 Line \u2014 Live View',text:'View my H2 Line sales',url:link});
  else copyLink(link);
}
function exportSnap(mode) {
  const S=STATE.sales, mn=money;
  const tot=S.reduce((a,r)=>a+r.finalTotal,0), pd=S.filter(r=>r.paymentStatus==='Paid').reduce((a,r)=>a+r.finalTotal,0);
  const pe=S.filter(r=>r.paymentStatus==='Pending').reduce((a,r)=>a+r.finalTotal,0), gt=S.reduce((a,r)=>a+(r.gstAmt||0),0);
  const wmap={};S.forEach(s=>{const w=weekStart(s.date);wmap[w]=(wmap[w]||0)+s.finalTotal;});
  const wdata=Object.keys(wmap).sort().slice(-8).map(w=>({label:weekLabel(w),total:wmap[w]}));
  const smap={};S.forEach(r=>{smap[r.shopName]=(smap[r.shopName]||0)+r.finalTotal;});
  const topS=Object.entries(smap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const imap={};S.forEach(r=>{imap[r.itemName]=(imap[r.itemName]||0)+r.finalTotal;});
  const topI=Object.entries(imap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const now=new Date().toLocaleString('en-IN');
  const salesTbl=(mode==='full')&&SHARE.perms.sales?'<section><h2>Sales History</h2><table><thead><tr><th>Date</th><th>Shop</th><th>Item</th><th>Type</th><th>GST</th><th>Total</th><th>Status</th></tr></thead><tbody>'+S.slice(-100).map(s=>'<tr><td>'+s.date+'</td><td>'+s.shopName+'</td><td>'+s.itemName+'</td><td>'+s.priceType+'</td><td>'+mn(s.gstAmt)+' '+(s.gstInclusive?'(incl.)':'(+8%)')+'</td><td><b>'+mn(s.finalTotal)+'</b></td><td>'+s.paymentStatus+'</td></tr>').join('')+'</tbody></table></section>':'';
  const weekTbl=(mode==='full'||mode==='report')?'<section><h2>Weekly Report</h2><table><thead><tr><th>Week</th><th>Total</th></tr></thead><tbody>'+wdata.map(w=>'<tr><td>'+w.label+'</td><td><b>'+mn(w.total)+'</b></td></tr>').join('')+'</tbody></table></section>':'';
  const html='<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H2 Line Snapshot</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Nunito:wght@400;500;600&display=swap"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:\'Nunito\',sans-serif;background:#0A0A0F;color:#F0F0FF;padding:20px;max-width:900px;margin:0 auto}.logo{font-family:\'Outfit\',sans-serif;font-size:26px;font-weight:800;color:#6366F1}.hdr{display:flex;justify-content:space-between;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.08)}.meta{font-size:12px;color:#8888AA;text-align:right}.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}.kcard{background:#141420;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px}.klbl{font-size:10px;font-weight:700;color:#555570;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}.kval{font-family:\'Outfit\',sans-serif;font-size:20px;font-weight:800}section{margin-bottom:28px}h2{font-family:\'Outfit\',sans-serif;font-size:16px;font-weight:700;margin-bottom:12px}table{width:100%;border-collapse:collapse;border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden}th{background:#1C1C2C;color:#8888AA;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;text-align:left}td{padding:10px 12px;border-top:1px solid rgba(255,255,255,.05);font-size:13px}.tops{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}.tc{background:#141420;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px}.note{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:10px 14px;font-size:12px;color:#F59E0B;margin-bottom:20px}@media(max-width:600px){.kgrid{grid-template-columns:1fr 1fr}.tops{grid-template-columns:1fr}}</style></head><body>' +
    '<div class="hdr"><div><div class="logo">H2 Line</div><div style="font-size:12px;color:#8888AA;margin-top:3px">View-only snapshot by '+(STATE.user?.name||'H2 Line')+'</div></div><div class="meta"><div>Generated: '+now+'</div><div>\uD83D\uDD12 Read-only</div></div></div>' +
    '<div class="note">\uD83D\uDC41 Read-only snapshot as of '+now+'.</div>' +
    '<div class="kgrid"><div class="kcard"><div class="klbl">Total Sales</div><div class="kval" style="color:#6366F1">'+mn(tot)+'</div></div><div class="kcard"><div class="klbl">Collected</div><div class="kval" style="color:#10B981">'+mn(pd)+'</div></div><div class="kcard"><div class="klbl">Pending</div><div class="kval" style="color:#F59E0B">'+mn(pe)+'</div></div><div class="kcard"><div class="klbl">GST @ 8%</div><div class="kval" style="color:#8B5CF6">'+mn(gt)+'</div></div></div>' +
    '<div class="tops"><div class="tc"><h2 style="font-size:14px;margin-bottom:10px">Top Shops</h2>'+topS.map(([n,t],i)=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px"><span><span style="color:#6366F1;margin-right:6px">'+(i+1)+'.</span>'+n+'</span><b>'+mn(t)+'</b></div>').join('')+'</div>' +
    '<div class="tc"><h2 style="font-size:14px;margin-bottom:10px">Top Items</h2>'+topI.map(([n,t],i)=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px"><span><span style="color:#6366F1;margin-right:6px">'+(i+1)+'.</span>'+n+'</span><b>'+mn(t)+'</b></div>').join('')+'</div></div>' +
    weekTbl + salesTbl + '</body></html>';
  dlFile(html,'h2line-snapshot-'+new Date().toISOString().split('T')[0]+'.html','text/html');
  showToast('\u2713 Snapshot exported!');
}

// ── VIEWER MODE ───────────────────────────────────────────────────────────────
async function bootViewer() {
  const root = document.getElementById('app');
  document.body.className = STATE.dark ? 'dark' : 'light';
  root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px"><div style="font-family:Outfit,sans-serif;font-size:28px;font-weight:800;color:var(--a)">H2 Line</div><div style="font-size:13px;color:var(--t2)">Loading shared view\u2026</div><div style="width:32px;height:32px;border:3px solid var(--as);border-top-color:var(--a);border-radius:50%;animation:spin 1s linear infinite"></div></div>';
  try {
    const res = await fetch(FIREBASE_URL+'/shares/'+VIEW_ID+'.json');
    if(!res.ok) throw new Error();
    const data = await res.json();
    if(!data) throw new Error();
    STATE.sales=data.sales||[]; STATE.items=data.items||[]; STATE.shops=data.shops||[];
    STATE.user={name:data.meta?.ownerName||'H2 Line',email:'viewer@h2line.app',id:'viewer'};
    STATE.isViewer=true; STATE.page='dashboard'; render();
  } catch {
    root.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:24px;text-align:center"><div style="font-size:36px">\uD83D\uDD12</div><div style="font-family:Outfit,sans-serif;font-size:20px;font-weight:700">Link not found</div><div style="font-size:13px;color:var(--t2)">This share link may have expired or been disabled.</div></div>';
  }
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function renderModal() {
  if(!STATE.modal) return '';
  let content='';
  if(STATE.modal.type==='addsale') content=renderAddSaleModal();
  else if(STATE.modal.type==='shop') content=renderShopModal(STATE.modal.data?.id);
  else if(STATE.modal.type==='item') content=renderItemModal(STATE.modal.data?.id);
  else if(STATE.modal.type==='share') content=renderShareModal();
  return '<div class="mov" id="modal-overlay" onclick="if(event.target.id===\'modal-overlay\')closeModal()"><div class="msh">'+content+'</div></div>';
}
function bindModal() {
  if(STATE.modal?.type==='addsale') recalc();
  if(STATE.modal?.type==='item') updateTiers();
}
function closeModal() { STATE.modal=null; render(); }

// ── BOOT ──────────────────────────────────────────────────────────────────────
if(VIEW_ID) bootViewer();
else render();
</script>
