}

async function approveUser(uid, approved) {
  if (!window.FB) return;
  try {
    await FB.setDoc(FB.doc(FB.db,'users',uid), {approved}, {merge:true});
    showToast(approved?'✓ User approved':'User access revoked');
    loadUsers();
  } catch(e) { showToast('⚠️ Failed: ' + e.message); }
}

// ── FIREBASE + BOOT ───────────────────────────────────────────────────────────
const ADMIN_EMAIL = window.ADMIN_EMAIL || 'hudhoon1999@gmail.com';
let _fbAuth = null, _fbDb = null, _snapshotUnsub = null;

async function initFirebase() {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
          signOut, onAuthStateChanged, updateProfile, sendPasswordResetEmail }
        = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
  const { getFirestore, doc, getDoc, setDoc, collection, getDocs, onSnapshot, serverTimestamp }
        = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

  const fbApp = initializeApp(window.FIREBASE_CONFIG);
  _fbAuth = getAuth(fbApp);
  _fbDb = getFirestore(fbApp);

  // ── Save to Firestore ──
  window.saveToFirestore = async function() {
    if (!STATE.isAdmin || !_fbDb) return;
    try {
      await setDoc(doc(_fbDb, 'shared', 'data'), {
        sales: STATE.sales, items: STATE.items, shops: STATE.shops,
        currency: STATE.currency || 'MVR', updatedAt: serverTimestamp()
      });
      // Success — clear the pending flag
      db.set('syncPending', false);
      console.log('✓ Firestore synced');
    } catch(e) {
      // Failed — keep syncPending=true so it retries when online
      db.set('syncPending', true);
      console.warn('Firestore save failed (will retry when online):', e.message);
    }
  };

  // ── Retry sync when internet comes back ──
  window.addEventListener('online', async () => {
    if (db.get('syncPending') && STATE.isAdmin && window.saveToFirestore) {
      console.log('Back online — retrying Firestore sync...');
      showToast('↑ Back online — syncing...');
      await window.saveToFirestore();
      if (!db.get('syncPending')) showToast('✓ All data synced to cloud');
    }
  });

  window.addEventListener('offline', () => {
    showToast('⚠️ Offline — changes saved locally');
  });

  // ── Load from Firestore ──
  async function loadFirestoreData() {
    try {
      const snap = await getDoc(doc(_fbDb, 'shared', 'data'));
      if (snap.exists()) {
        const d = snap.data();
        STATE.sales = (d.sales || []).map(normalizeSaleGSTRow);
        STATE.items = d.items || [];
        STATE.shops = d.shops || [];
        STATE.currency = d.currency || 'MVR';
        db.set('sales', STATE.sales); db.set('items', STATE.items); db.set('shops', STATE.shops);
      } else if (STATE.isAdmin) {
        await window.saveToFirestore();
      }
    } catch(e) {
      console.warn('Firestore load failed, using localStorage:', e.message);
      STATE.sales = db.get('sales', []).map(normalizeSaleGSTRow);
      STATE.items = db.get('items', []);
      STATE.shops = db.get('shops', []);
    }
  }

  // ── Auth functions ──
  window.doFBLogin = async function() {
    const email = (document.getElementById('a-email')||{}).value?.trim()||'';
    const pw = (document.getElementById('a-pw')||{}).value||'';
    const sub = document.getElementById('a-submit');
    if(!email||!pw){
      if(sub){sub.textContent='Log In';sub.disabled=false;}
      showAuthMsg('Enter email and password'); return;
    }
    try {
      await signInWithEmailAndPassword(_fbAuth, email, pw);
      // onAuthStateChanged handles redirect — spinner stays until logged in
    } catch(e) {
      if(sub){sub.textContent='Log In';sub.disabled=false;}
      const msg = e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'
        ? 'Wrong email or password' : e.message||'Login failed';
      showAuthMsg(msg);
    }
  };

  window.doFBSignup = async function() {
    const name = (document.getElementById('a-name')||{}).value?.trim()||'';
    const email = (document.getElementById('a-email')||{}).value?.trim()||'';
    const pw = (document.getElementById('a-pw')||{}).value||'';
    const sub = document.getElementById('a-submit');
    if(!name||!email||!pw){
      if(sub){sub.textContent='Create Account';sub.disabled=false;}
      showAuthMsg('Fill all fields'); return;
    }
    try {
      const cred = await createUserWithEmailAndPassword(_fbAuth, email, pw);
      await updateProfile(cred.user, {displayName: name});
      const isAdmin = email === ADMIN_EMAIL;
      await setDoc(doc(_fbDb, 'users', cred.user.uid), {
        name, email, role: isAdmin?'admin':'user', approved: isAdmin,
        createdAt: serverTimestamp()
      });
      showAuthMsg('✓ Account created' + (isAdmin?'':' — awaiting admin approval'), true);
      if(sub){sub.textContent='Create Account';sub.disabled=false;}
    } catch(e) {
      if(sub){sub.textContent='Create Account';sub.disabled=false;}
      showAuthMsg(e.code==='auth/email-already-in-use'?'Email already registered — try Log In':e.message||'Sign up failed');
    }
  };

  window.doFBForgot = async function() {
    const email = (document.getElementById('a-email')||{}).value?.trim()||'';
    if(!email){showAuthMsg('Enter your email first');return;}
    try { await sendPasswordResetEmail(_fbAuth, email); showAuthMsg('✓ Reset email sent', true); }
    catch(e) { showAuthMsg(e.message||'Failed'); }
  };

  window.doFBLogout = async function() {
    if(!confirm('Sign out?')) return;
    if(_snapshotUnsub){_snapshotUnsub();_snapshotUnsub=null;}
    await signOut(_fbAuth);
    STATE.user=null; STATE.isAdmin=false; STATE.isViewer=false;
    STATE.sales=[]; STATE.items=[]; STATE.shops=[];
    db.set('user',null); render();
  };

  // ── Load users for admin ──
  window.loadUsers = async function() {
    if (!STATE.isAdmin || !_fbDb) return;
    const el = document.getElementById('users-list'); if(!el) return;
    el.innerHTML = '<div style="font-size:12px;color:var(--t2);padding:8px 0">Loading...</div>';
    try {
      const snap = await getDocs(collection(_fbDb, 'users'));
      const users = [];
      snap.forEach(d => users.push({id:d.id,...d.data()}));
      if(!users.length){el.innerHTML='<div style="font-size:12px;color:var(--t3)">No users yet.</div>';return;}
      el.innerHTML = users.map(u => {
        const isMe = u.email === STATE.user?.email;
        const isAdm = u.email === ADMIN_EMAIL;
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--b)">' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-size:13px;font-weight:600">' + (u.name||'Unknown') + (isMe?' <span style="color:var(--t3);font-size:10px">(you)</span>':'') + '</div>' +
            '<div style="font-size:11px;color:var(--t2)">' + (u.email||'') + '</div>' +
            '<div style="margin-top:3px">' + (isAdm?'<span style="background:linear-gradient(135deg,var(--a),var(--gst));color:#fff;padding:1px 7px;border-radius:99px;font-size:9px;font-weight:700">⚡ Admin</span>':u.approved?'<span style="background:var(--oks);color:var(--ok);padding:1px 7px;border-radius:99px;font-size:9px;font-weight:700">✓ Approved</span>':'<span style="background:var(--warns);color:var(--warn);padding:1px 7px;border-radius:99px;font-size:9px;font-weight:700">⏳ Pending</span>') + '</div>' +
          '</div>' +
          (!isMe && !isAdm ? '<div style="display:flex;gap:6px">' +
            (!u.approved?'<button class="btn" style="background:var(--oks);color:var(--ok);border-radius:var(--rs);padding:6px 10px;font-size:11px;font-weight:700" onclick="approveUser(\'' + u.id + '\',true)">✓ Approve</button>':'') +
            (u.approved?'<button class="btn bs" style="padding:6px 10px;font-size:11px" onclick="approveUser(\'' + u.id + '\',false)">Revoke</button>':'') +
          '</div>':'') +
        '</div>';
      }).join('');
    } catch(e) { el.innerHTML='<div style="font-size:12px;color:var(--err)">Failed: '+e.message+'</div>'; }
  };

  window.approveUser = async function(uid, approved) {
    if(!_fbDb) return;
    try { await setDoc(doc(_fbDb,'users',uid),{approved},{merge:true}); showToast(approved?'✓ Approved':'Revoked'); loadUsers(); }
    catch(e) { showToast('⚠️ '+e.message); }
  };

  // ── Auth state listener ──
  onAuthStateChanged(_fbAuth, async (fbUser) => {
    if(_snapshotUnsub){_snapshotUnsub();_snapshotUnsub=null;}
    if (fbUser) {
      const isAdmin = fbUser.email === ADMIN_EMAIL;
      STATE.user = { id:fbUser.uid, name:fbUser.displayName||fbUser.email.split('@')[0], email:fbUser.email, role:isAdmin?'admin':'user', approved:true };
      STATE.isAdmin = isAdmin;
      STATE.isViewer = !isAdmin;
      db.set('user', STATE.user);

      // Load Firestore profile
      try {
        const profSnap = await getDoc(doc(_fbDb,'users',fbUser.uid));
        if(profSnap.exists()){
          const p=profSnap.data();
          STATE.user.name=p.name||STATE.user.name;
          STATE.user.approved=isAdmin?true:(p.approved!==false);
        } else if(isAdmin) {
          await setDoc(doc(_fbDb,'users',fbUser.uid),{name:STATE.user.name,email:fbUser.email,role:'admin',approved:true});
        }
      } catch(e){console.warn('Profile load:',e.message);}

      await loadFirestoreData();

      // Real-time listener
      try {
        _snapshotUnsub = onSnapshot(doc(_fbDb,'shared','data'), (snap) => {
          if(!snap.exists()) return;
          const d=snap.data();
          const newSales=(d.sales||[]).map(normalizeSaleGSTRow);
          const newItems=d.items||[];
          const newShops=d.shops||[];
          // Only update if data actually changed to prevent unnecessary re-renders
          if(JSON.stringify(newSales)!==JSON.stringify(STATE.sales)||
             JSON.stringify(newItems)!==JSON.stringify(STATE.items)||
             JSON.stringify(newShops)!==JSON.stringify(STATE.shops)){
            STATE.sales=newSales; STATE.items=newItems; STATE.shops=newShops;
            render();
          }
        }, (err)=>console.warn('Snapshot error:',err.message));
      } catch(e){console.warn('Snapshot setup:',e.message);}

      render();
    } else {
      STATE.user=null; STATE.isAdmin=false; STATE.isViewer=false;
      render();
    }
  });
}

// Boot
if (VIEW_ID) {
  bootViewer();
} else {
  // Show loading screen immediately
  document.body.className = STATE.dark ? 'dark' : 'light';
  const root = document.getElementById('app');
  if(root) root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px">' +
    '<img src="'+LOGO_ICON+'" style="width:64px;height:64px;border-radius:16px;margin-bottom:4px">' +
    '<div style="font-family:Outfit,sans-serif;font-size:22px;font-weight:800;color:var(--a)">H2 Line</div>' +
    '<div style="width:28px;height:28px;border:3px solid var(--as);border-top-color:var(--a);border-radius:50%;animation:spin 1s linear infinite"></div>' +
    '<div style="font-size:12px;color:var(--t2)">Connecting to Firebase…</div>' +
  '</div>';
  // Init Firebase — all in correct order
  initFirebase().catch(e => {
    console.error('Firebase init failed:', e);
    // Fall back to localStorage-only mode
    STATE.user = db.get('user');
    STATE.sales = db.get('sales',[]).map(normalizeSaleGSTRow);
    STATE.items = db.get('items',[]);
    STATE.shops = db.get('shops',[]);
    if(STATE.user) { STATE.isAdmin = STATE.user.email === ADMIN_EMAIL; STATE.isViewer = !STATE.isAdmin; }
    render();
  });
}

// ── SERVICE WORKER (offline PWA support) ─────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      const CACHE = 'h2line-v3';
      self.addEventListener('install', e => {
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
        self.clients.claim();
      });
      self.addEventListener('fetch', e => {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;
    try {
      const blob = new Blob([swCode], {type:'application/javascript'});
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url, {scope:'/'}).catch(()=>{});
    } catch(e) {}
  });
}

function formatPackLabel(row){
  const type = String(row.priceType || '').toLowerCase();
  const pack = parseInt(row.packSize || 0) || 0;
  const qty = parseInt(row.quantity || 1) || 1;

  if(type === 'case'){
    return `${qty} Case (${pack || 12} pcs)`;
  }

  if(type === 'halfCase' || type === 'halfcase'){
    return `${qty} Half Case (${pack || 6} pcs)`;
  }

  return `${qty} Unit`;
}

function getInvoiceDisplayPrice(row){
  const type = String(row.priceType || '').toLowerCase();

  if(type === 'case'){
    return row.casePrice || row.lineTotal || 0;
  }

  if(type === 'halfCase' || type === 'halfcase'){
    return row.halfPrice || row.lineTotal || 0;
  }

  return getInvoiceDisplayPrice(row) || 0;
}
